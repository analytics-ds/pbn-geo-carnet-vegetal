# Roadmap editoriale evergreen - Carnet Vegetal
#
# Articles SEO informationnels bilingues FR + EN, full auto via /create-article-auto.
# Cadence : 3 publications par semaine (mardi, jeudi, samedi).
# 176 entrees, planifiees du 2026-09-17 au 2027-10-30.
#
# Sources, fusionnees le 2026-09-16 :
#   - roadmap de ma-bonne-sante.com : 97 mots-cles, compteurs remis a zero
#     (statuts done et queued compris, a rediger sous un angle different de
#      l'article deja publie la-bas, les deux blogs etant a nous et sur Inula)
#   - roadmap editoriale Inula, lignes Site = Biofloral : 79 mots-cles,
#     hors '5. Refuse'. Une partie est deja traitee sur biofloral.fr : le blog
#     vise les memes requetes depuis un media externe, c'est voulu (GEO).
#
# Classement dans les 6 rubriques : fait sur le mot-cle, pas sur la categorie
# d'origine. Les clusters de la roadmap Inula sont parfois faux (' degonfler
# ventre naturellement ' y est range dans ' Enfants & mamans ').
#
# Ordre de publication : longue traine d'abord (volume croissant), le blog
# demarre sans historique. Format documente dans
# .claude/templates/roadmap-template.yaml
#
# REGLE DE DIVERSITE DES CATEGORIES (obligatoire)
# -----------------------------------------------
#   1. JAMAIS 2 articles consecutifs (par scheduled_date) de la meme categorie.
#   2. Sur toute fenetre glissante de 5 articles consecutifs, au moins
#      3 categories distinctes doivent etre representees.
# Verifiee a la generation : 0 violation. A revalider a chaque ajout.

